name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly secret scan of the full history, Mondays 05:17 UTC.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known vulnerabilities in production dependencies
        run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Golden tests need a trace of the original game and are skipped here.
      - run: pnpm test
      - run: pnpm build

  tools:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/re
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/re/requirements-dev.txt
            tools/font/requirements.txt
      - run: pip install -r requirements-dev.txt -r ../font/requirements.txt
      - run: ruff check . ../font
      - run: python -m unittest discover -p "test_*.py"

  hygiene:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads every commit.
          fetch-depth: 0
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9.-]+\))?!?: [^ ].{0,71}$'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "The title becomes the squash commit and must look like 'type(scope): subject' (subject up to 72 characters)."
            exit 1
          fi
      - name: No secrets in the git history
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
      - name: No em dashes or emoji in sources and docs
        env:
          LC_ALL: C.UTF-8
        run: |
          if grep -rnP '\x{2014}|[\x{1F300}-\x{1FAFF}]|[\x{2600}-\x{27BF}]' --include='*.ts' --include='*.tsx' --include='*.py' --include='*.md' --include='*.yml' --include='*.json' --include='*.css' --include='*.html' --include='*.mjs' src tools docs scripts .github package.json index.html README.md SECURITY.md; then
            echo "Found forbidden characters"; exit 1
          fi
