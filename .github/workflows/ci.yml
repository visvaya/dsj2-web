name: CI

on:
  push:
    branches: [master]
  pull_request:
  # A run started by hand on the default branch goes through the same checks and, like a push, may publish.
  workflow_dispatch:
  schedule:
    # Weekly secret scan of the full history and workflow audit, Mondays 05:17 UTC.
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer push to a pull request cancels the run before it. Runs on the default branch are never cancelled:
# one of them may be publishing, and a run cut off in the middle of that would leave no record of what it did.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Each required status check (web, tools, hygiene) is a job named after its id. web is an aggregate: it waits for
  # build and then the browser jobs, which run side by side, and passes only when each of them did its part.
  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser_tests: ${{ steps.browser.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, to see which files a pull request changes.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known vulnerabilities in production dependencies
        run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - name: No unused files, exports or dependencies
        run: pnpm check:unused
      # src/sim is exempt (.jscpd.json): it is a port whose routines mirror the original's, including its
      # repetitions, so they are not merged.
      - name: No duplicated code
        run: pnpm check:duplicates
      - run: pnpm format:check
      # Golden tests need a trace of the original game and are skipped here. The run also enforces the
      # coverage thresholds for src/sim set in vite.config.ts.
      - run: pnpm test:coverage
      - run: pnpm test:scripts
      # The package that the jobs below test and, on the default branch, publish: built once, never rebuilt.
      - run: pnpm build
      - name: Exactly the build's own files in dist/, within the size budget
        run: pnpm check:dist
      # Browser tests take several minutes, so a pull request that cannot change what the browser gets
      # (documentation, the analysis tools, unit tests only) skips them; the default branch always runs them.
      # A difference that cannot be read runs them too.
      - name: Decide whether the browser tests are needed
        id: browser
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          needed=true
          deploy_tool=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # A renamed file is listed under its old and its new name, so moving a file out of src/ counts.
            if changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
              # Files that reach the browser or the tests of it, without unit tests and their support files.
              relevant=$(printf '%s\n' "$changed" |
                grep -E '^(src/|e2e/|public/|scripts/|\.github/workflows/|index\.html$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$|vite\.config\.ts$|playwright\.config\.ts$)' |
                grep -vE '(\.test\.ts$|\.snap$|^src/sim/test-support/|^src/original/test-support/)' || true)
              if [ -z "$relevant" ]; then needed=false; fi
              # The deployment tool is tried only by pull requests that change it or the way it is run.
              if printf '%s\n' "$changed" | grep -qE '^(deploy/|\.github/workflows/|scripts/run-wrangler\.mjs$)'; then
                deploy_tool=true
              fi
            else
              echo "::warning::The changed files could not be listed; the browser tests run."
              deploy_tool=true
            fi
          fi
          echo "needed=$needed" | tee -a "$GITHUB_OUTPUT"
          echo "deploy_tool=$deploy_tool" | tee -a "$GITHUB_OUTPUT"
      # The deployment job runs only on the default branch, after a merge. A pull request that changes the tool,
      # its configuration or the workflows tries them here, without credentials: the tool installs from its own
      # lockfile and accepts the configuration and the package.
      - name: The deployment tool installs and accepts the package
        if: steps.browser.outputs.deploy_tool == 'true'
        working-directory: deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm install --frozen-lockfile
          # The arguments of the real publication, plus the one that stops short of it.
          pnpm exec wrangler deploy --dry-run --message "$GITHUB_SHA"
      - name: The package is still byte for byte what was built
        run: sha256sum --check --strict --quiet dist.sha256
      # Named after the commit, so the jobs below and the deployment job can only take the package of their own
      # run and commit. A pull request keeps it only as long as a rerun of a failed job may need it.
      - name: Keep the package for the browser tests and the deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemark-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error
          # A job that is run again replaces the package of its earlier attempt.
          overwrite: true
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}

  # The package in real browsers, side by side, each job with only its own browser installed. The browser suites
  # run the desktop, phone and tablet profiles of one engine (chosen in playwright.config.ts, so a new profile joins
  # the job of its engine). The perf suite times the game in Chromium on a slowed processor and checks what a
  # series of jumps leaves in memory; it has a machine of its own, so nothing else is measured along with the game.
  browser:
    name: ${{ matrix.suite }} (${{ matrix.engine }})
    needs: build
    if: needs.build.outputs.browser_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failure in one job does not stop the others, so one run shows everything that fails.
      fail-fast: false
      matrix:
        include:
          - { suite: browser, engine: chromium }
          - { suite: browser, engine: firefox }
          - { suite: browser, engine: webkit }
          - { suite: perf, engine: chromium }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telemark-dist-${{ github.sha }}
      - name: The package is the one that was built
        run: sha256sum --check --strict --quiet dist.sha256
      # The browsers are cached per Playwright version and engine; the system packages they need are not, so a
      # cache hit still installs those.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engine }}
      - name: Install the browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          ENGINE: ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps "$ENGINE"
      - name: Install the system packages of the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        env:
          ENGINE: ${{ matrix.engine }}
        run: pnpm exec playwright install-deps "$ENGINE"
      - name: The game works in real browsers
        if: matrix.suite == 'browser'
        env:
          BROWSER_TESTS_ENGINE: ${{ matrix.engine }}
        run: pnpm test:browser
      - name: The game keeps its time and memory budgets
        if: matrix.suite == 'perf'
        run: pnpm test:browser:perf
      # A test that failed and then passed on its retry leaves the run green; the trace of the failed attempt is
      # the only record of what went wrong, so it is kept as well.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (failure() || hashFiles('test-results/**/trace.zip', 'test-results-perf/**/trace.zip') != '') }}
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
            playwright-report-perf/
            test-results-perf/
          if-no-files-found: ignore
          retention-days: 7

  # The required check for the package: green only when build passed and every browser job passed, or they were
  # skipped because build found that the pull request cannot change what the browser gets. A failed, cancelled or
  # otherwise skipped job leaves it red.
  web:
    name: web
    needs: [build, browser]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_tests: ${{ steps.verdict.outputs.browser_tests }}
    steps:
      - name: Every part of the check did its work
        id: verdict
        env:
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
          NEEDED: ${{ needs.build.outputs.browser_tests }}
        run: |
          echo "build: $BUILD, browser jobs: $BROWSER, browser tests needed: $NEEDED"
          if [ "$BUILD" != "success" ]; then echo "The build job did not succeed."; exit 1; fi
          if [ "$NEEDED" = "true" ]; then
            if [ "$BROWSER" != "success" ]; then echo "The browser tests were needed and did not all succeed."; exit 1; fi
          elif [ "$NEEDED" = "false" ]; then
            if [ "$BROWSER" != "skipped" ]; then echo "The browser tests were not needed, yet they did not stay skipped."; exit 1; fi
          else
            echo "The build job did not say whether the browser tests were needed."; exit 1
          fi
          echo "browser_tests=$NEEDED" | tee -a "$GITHUB_OUTPUT"

  tools:
    name: tools
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/re
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/re/requirements-dev.txt
            tools/font/requirements.txt
      - run: pip install -r requirements-dev.txt -r ../font/requirements.txt
      - run: ruff check . ../font
      - run: python -m unittest discover -p "test_*.py"

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # Checksum of the manylinux x86_64 wheel on PyPI.
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads every commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9.-]+\))?!?: [^ ].{0,71}$'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "The title becomes the squash commit and must look like 'type(scope): subject' (subject up to 72 characters)."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
      # The checkout of a pull request is its merge into the default branch, so the first parent is the head of
      # that branch and the difference is the pull request. Publishing refuses a changed game under a version
      # that is not above the deployed one; this tells it already here.
      - name: The version moves as the title says, and only with the game
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-version.mjs --base HEAD^1 --title "$PR_TITLE"
      - name: No secrets in the git history
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
      # actionlint checks that the workflows are correct (expressions, action inputs, ShellCheck on the run
      # scripts); zizmor checks that they are safe. Both run even when an earlier step has failed.
      - name: Workflows pass actionlint
        if: ${{ !cancelled() }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Workflows pass the zizmor security audit
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --only-binary :all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
          # Offline: the audits that query the GitHub API are skipped, so the step needs no token.
          "$RUNNER_TEMP/zizmor/bin/zizmor" --persona pedantic --offline .github/workflows .github/dependabot.yml
      - name: No em dashes or emoji in tracked files
        env:
          LC_ALL: C.UTF-8
        run: |
          # Every tracked text file is searched. Only "no match" (exit 1) passes, so a failed search fails the job.
          status=0
          git grep -nIP '\x{2014}|[\x{1F300}-\x{1FAFF}]|[\x{2600}-\x{27BF}]' || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Found forbidden characters, or the search itself failed (exit $status)"; exit 1
          fi

  # Publishes the package that the jobs above built, checked and tested, for the same commit and in the same
  # run. It runs only on the default branch and only while the repository variable DEPLOY_ENABLED is "true";
  # setting it to anything else pauses automatic publishing (before a rollback, for example). A pull request
  # and the weekly schedule never reach it. Every needed job has to succeed: a skipped or cancelled one skips
  # this job too.
  deploy:
    name: deploy
    needs: [web, tools, hygiene]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The credentials live in this environment, which is restricted to the default branch in the repository
    # settings, so no other job and no other branch can read them.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # One publication or rollback at a time, and none is cancelled once it has started. A run that waits here
    # is replaced by a newer one that starts to wait; the check for the head of the branch below covers the rest.
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The browser tests ran for this commit and the address of the game is known
        env:
          BROWSER_TESTS: ${{ needs.web.outputs.browser_tests }}
        run: |
          if [ "$BROWSER_TESTS" != "true" ]; then
            echo "The browser tests did not run for this commit; nothing is published."; exit 1
          fi
          if [ -z "$PRODUCTION_URL" ]; then
            echo "The repository variable PRODUCTION_URL is not set; nothing is published."; exit 1
          fi
      # A run that was waiting, or is run again later, must not put an older commit over a newer one.
      - name: This commit is still the head of the default branch
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          # An empty answer is a failed question, not a branch that has moved on.
          if [ -z "$head" ]; then
            echo "The head of the default branch could not be read; nothing is published."; exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "current=false" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::The default branch has moved on from this commit; nothing is published."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telemark-dist-${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No cache: what is restored into this job would run next to the credentials.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The package is the one that was built and tested, for this commit
        run: |
          sha256sum --check --strict --quiet dist.sha256
          # Every file is on the list, and the list names nothing else.
          test "$(find dist -type f | wc -l)" -eq "$(wc -l < dist.sha256)"
          node scripts/check-dist.mjs
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("dist/release.json", "utf8")).sourceSha')" = "$GITHUB_SHA"
      - name: Install the deployment tool from its lockfile
        working-directory: deploy
        run: pnpm install --frozen-lockfile
      # A commit that changes nothing in the game builds the same content. Publishing it again would make every
      # player's browser fetch the whole game once more, so it is not published. A changed game whose version
      # is not above the deployed one fails here: players would see an old number on a new game.
      - name: Compare the package with what is deployed
        id: compare
        if: steps.head.outputs.current == 'true'
        run: node scripts/compare-release.mjs "$PRODUCTION_URL"
      - name: Publish the package
        id: publish
        if: steps.head.outputs.current == 'true' && steps.compare.outputs.same_content != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-wrangler.mjs deploy --message "$GITHUB_SHA"
      - name: The deployed game answers with this package
        if: steps.publish.outcome == 'success'
        run: node scripts/check-deployment.mjs "$PRODUCTION_URL" --source-sha "$GITHUB_SHA" --wait-s 120
      - name: The deployed game still answers with this content
        if: steps.head.outputs.current == 'true' && steps.compare.outputs.same_content == 'true'
        run: |
          content=$(node -p 'JSON.parse(require("node:fs").readFileSync("dist/release.json", "utf8")).contentId')
          node scripts/check-deployment.mjs "$PRODUCTION_URL" --served-release --content-id "$content"
      - name: Report
        if: ${{ !cancelled() }}
        env:
          CURRENT: ${{ steps.head.outputs.current }}
          SAME_CONTENT: ${{ steps.compare.outputs.same_content }}
          PUBLISHED: ${{ steps.publish.outcome }}
          VERSION_ID: ${{ steps.publish.outputs.version_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$CURRENT" != "true" ]; then result="not published: the default branch has moved on"
          elif [ "$SAME_CONTENT" = "true" ]; then result="not published: the deployed content is already this one"
          elif [ "$PUBLISHED" = "success" ]; then result="published"
          else result="not published: see the failed step"; fi
          content=$(node -p 'JSON.parse(require("node:fs").readFileSync("dist/release.json", "utf8")).contentId' 2>/dev/null || echo unknown)
          checksum=$(sha256sum dist.sha256 2>/dev/null | cut -d' ' -f1)
          {
            echo "### Deployment"
            echo
            echo "- Result: $result (job $JOB_STATUS)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Content: $content"
            echo "- Package checksum (SHA-256 of dist.sha256): ${checksum:-unknown}"
            echo "- Version, for a rollback: ${VERSION_ID:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tags the commit that was just published with its version (package.json) and opens a release on GitHub with
  # the pull requests since the one before. Apart from the deployment, so the credentials of the host and the
  # right to write to the repository never meet in one job.
  release:
    name: release
    needs: deploy
    if: needs.deploy.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag the published commit with its version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$tag is already on this commit."; exit 0
          fi
          # Only after a rollback can the same version be published from a later commit (one that changed
          # nothing in the game); the release stays with the commit it was made for.
          if [ -n "$tagged" ]; then
            echo "::warning::$tag is already on $tagged; published again from this commit, no new release."; exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          { echo "### Release"; echo; echo "- $tag on $GITHUB_SHA"; } >> "$GITHUB_STEP_SUMMARY"
