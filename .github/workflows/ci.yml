name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly secret scan of the full history and workflow audit, Mondays 05:17 UTC.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job name is a required status check on pull requests; keep it equal to the job id.
  web:
    name: web
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known vulnerabilities in production dependencies
        run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Golden tests need a trace of the original game and are skipped here. The run also enforces the
      # coverage thresholds for src/sim set in vite.config.ts.
      - run: pnpm test:coverage
      - run: pnpm test:scripts
      - run: pnpm build
      - name: Only the build's own files in dist/, within the size budget
        run: pnpm check:dist

  tools:
    name: tools
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/re
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/re/requirements-dev.txt
            tools/font/requirements.txt
      - run: pip install -r requirements-dev.txt -r ../font/requirements.txt
      - run: ruff check . ../font
      - run: python -m unittest discover -p "test_*.py"

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # Checksum of the manylinux x86_64 wheel on PyPI.
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads every commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9.-]+\))?!?: [^ ].{0,71}$'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "The title becomes the squash commit and must look like 'type(scope): subject' (subject up to 72 characters)."
            exit 1
          fi
      - name: No secrets in the git history
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
      # actionlint checks that the workflows are correct (expressions, action inputs, ShellCheck on the run
      # scripts); zizmor checks that they are safe. Both run even when an earlier step has failed.
      - name: Workflows pass actionlint
        if: ${{ !cancelled() }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Workflows pass the zizmor security audit
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --only-binary :all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
          # Offline: the audits that query the GitHub API are skipped, so the step needs no token.
          "$RUNNER_TEMP/zizmor/bin/zizmor" --persona pedantic --offline .github/workflows .github/dependabot.yml
      - name: No em dashes or emoji in tracked files
        env:
          LC_ALL: C.UTF-8
        run: |
          # Every tracked text file is searched. Only "no match" (exit 1) passes, so a failed search fails the job.
          status=0
          git grep -nIP '\x{2014}|[\x{1F300}-\x{1FAFF}]|[\x{2600}-\x{27BF}]' || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Found forbidden characters, or the search itself failed (exit $status)"; exit 1
          fi
