name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Golden tests need a trace of the original game and are skipped here.
      - run: pnpm test
      - run: pnpm build

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/re
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/re/requirements-dev.txt
            tools/font/requirements.txt
      - run: pip install -r requirements-dev.txt -r ../font/requirements.txt
      - run: ruff check . ../font
      - run: python -m unittest discover -p "test_*.py"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No em dashes or emoji in sources and docs
        env:
          LC_ALL: C.UTF-8
        run: |
          if grep -rnP '\x{2014}|[\x{1F300}-\x{1FAFF}]|[\x{2600}-\x{27BF}]' --include='*.ts' --include='*.tsx' --include='*.py' --include='*.md' --include='*.yml' --include='*.json' --include='*.css' --include='*.html' --include='*.mjs' src tools docs scripts .github package.json index.html; then
            echo "Found forbidden characters"; exit 1
          fi
