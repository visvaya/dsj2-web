<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Skoki narciarskie w przeglądarce: trening na skoczni, sterowanie myszą, klawiaturą albo dotykiem."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telemark" />
    <!-- Marks the page of the regular build. The game registers its service worker only where this is present,
         so the single-file page, which has no such line, never does. -->
    <meta name="telemark-offline" content="service-worker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Telemark</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown only while the game has not started: it appears after a moment (src/ui/app.css) and the game
           replaces it. If a script of the game cannot be fetched, this is what is left instead of a blank page. -->
      <p class="boot-note">
        Telemark: wczytywanie gry. Jeśli ten napis nie znika, <a href="/">wczytaj stronę ponownie</a>.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
